services:
  postgres:
    image: postgres:17-alpine
    container_name: homelab-postgres
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: homelab_dev
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - homelab-network

networks:
  homelab-network:
    external: true