
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: nvidia_gpu
    static_configs:
      - targets: ["host.docker.internal:9835"]

  - job_name: docker_health
    static_configs:
      - targets: ["docker-health-exporter:9066"]
